<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8" />
    <title>Đăng ký</title>
    <link rel="stylesheet" th:href="@{/css/register.css}" />
</head>
<body>
<div class="container">
    <div class="register-form">
        <h2>Đăng ký</h2>
        
        <form th:action="@{/register}" method="post" th:object="${registerRequest}">
            <div class="input-group">
                <label for="username">👤 Tên đăng nhập</label>
                <input type="text" id="username" th:field="*{username}" required />
            </div>

            <div class="input-group">
                <label for="fullName">📝 Họ và tên</label>
                <input type="text" id="fullName" th:field="*{fullName}" required />
            </div>

            <div class="input-group">
                <label for="email">📧 Email</label>
                <input type="email" id="email" th:field="*{email}" required />
            </div>

            <div class="input-group">
                <label for="phone">📞 Số điện thoại</label>
                <input type="tel" id="phone" th:field="*{phone}" required />
            </div>

            <div class="input-group">
                <label for="dateOfBirth">🎂 Ngày sinh</label>
                <input type="date" id="dateOfBirth" th:field="*{dateOfBirth}" required />
            </div>

            <div class="input-group password-group">
                <label for="password">🔒 Mật khẩu</label>
                <div class="password-wrapper">
                    <input type="password" id="password" th:field="*{password}" required />
                    <span class="toggle-password" onclick="togglePassword('password', this)">
                        <img src="/images/eye.png" alt="Show/Hide" />
                    </span>
                </div>
            </div>

            <div class="input-group password-group">
                <label for="confirmPassword">🔁 Nhập lại mật khẩu</label>
                <div class="password-wrapper">
                    <input type="password" id="confirmPassword" name="confirmPassword" required />
                    <span class="toggle-password" onclick="togglePassword('confirmPassword', this)">
                        <img src="/images/eye.png" alt="Show/Hide" />
                    </span>
                </div>
            </div>

            <!-- CSRF token -->
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <button type="submit" class="btn-primary">ĐĂNG KÝ</button>
        </form>

        <p class="link-to-login">
            Đã có tài khoản? <a th:href="@{/login}">Đăng nhập</a>
        </p>
    </div>
</div>

<script>
    function togglePassword(inputId, iconElement) {
        const input = document.getElementById(inputId);
        const img = iconElement.querySelector('img');

        const showIcon = '/images/eye.png';
        const hideIcon = '/images/hide.png';

        if (input.type === 'password') {
            input.type = 'text';
            img.src = hideIcon;
        } else {
            input.type = 'password';
            img.src = showIcon;
        }
    }

    // Kiểm tra mật khẩu khớp trực tiếp khi submit form
    document.querySelector('form').addEventListener('submit', function (event) {
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        if (password !== confirmPassword) {
            event.preventDefault();
            alert('Mật khẩu không khớp. Vui lòng kiểm tra lại.');
        }
    });
</script>
</body>
</html>
