<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title>Giỏ Hàng</title>
    <link rel="stylesheet" href="/css/cart.css">
</head>
<body>
    <div class="top-bar">
        <div class="top-right">
            <a href="#">Thông Báo</a> |
            <a href="#">Hỗ Trợ</a> |
            <form id="logoutForm" th:action="@{/logout}" method="post" style="display:none;">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            </form>
            <a href="#" onclick="document.getElementById('logoutForm').submit(); return false;">Đăng Xuất</a>
        </div>
    </div>
    <div class="main-header">
        <div class="logo" id="logo">
            <img src="/images/shop.png" alt="Shop Logo" class="logo-img">
            MyShop
        </div> 
        <input type="text" class="search-box" placeholder="Tìm kiếm sản phẩm...">
    </div>

    <div class="cart-container">
        <table class="cart-table">
            <thead>
                <tr>
                    <th>Sản phẩm</th>
                    <th>Đơn giá</th>
                    <th>Số lượng</th>
                    <th>Thành tiền</th>
                    <th>Thao tác</th>
                </tr>
            </thead>
            <tbody id="cart-items"></tbody>
        </table>

        <div class="cart-summary">
            <span>Tổng cộng: <strong id="total-price">0₫</strong></span>
            <button class="checkout-btn">Mua Hàng</button>
        </div>
    </div>

    <script src="/js/cart.js"></script>
</body>
</html>
