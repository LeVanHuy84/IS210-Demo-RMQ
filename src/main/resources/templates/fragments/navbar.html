<!-- fragments/navbar.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<nav th:fragment="body" class="navbar navbar-expand-lg navbar-light bg-light">
  <div class="container-fluid">
    <a class="navbar-brand" href="/web/index">
      <img src="/images/shop.png" alt="Logo" width="30" height="24" class="d-inline-block align-text-top">
      MyShop
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link" href="/web/index">Trang chủ</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/web/orders">Đơn mua</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#" onclick="document.getElementById('logoutForm').submit(); return false;">Đăng xuất</a>
        </li>
      </ul>
    </div>
  </div>

  <!-- Form logout ẩn -->
  <form id="logoutForm" th:action="@{/logout}" method="post" style="display: none;">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
  </form>
</nav>
</body>
</html>
