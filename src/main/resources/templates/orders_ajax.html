<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Giỏ Hàng</title>
    <link rel="stylesheet" href="/orderStyle.css">
</head>
<body>

    <div class="main-header">
        <div class="logo">🛒 Giỏ Hàng</div>
        <input type="text" class="search-box" placeholder="Tìm kiếm sản phẩm...">
    </div>

    <div class="cart-container">
        <table class="cart-table">
            <thead>
                <tr>
                    <th>Sản phẩm</th>
                    <th>Đơn giá</th>
                    <th>Số lượng</th>
                    <th>Thành tiền</th>
                    <th>Thao tác</th>
                </tr>
            </thead>
            <tbody id="cart-items"></tbody>
        </table>

        <div class="cart-summary">
            <span>Tổng cộng: <strong id="total-price">0₫</strong></span>
            <button class="checkout-btn">Mua Hàng</button>
        </div>
    </div>

    <script src="/cart.js"></script>
</body>
</html>
