<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="user-role" th:content="${#authentication?.principal?.authorities}"/>
    <title>Product Shop</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<div class="top-bar">
    <div class="top-right">
        <a href="#">Thông Báo</a> |
        <a href="#">Hỗ Trợ</a> |
        <form id="logoutForm" th:action="@{/logout}" method="post" style="display:none;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        </form>
        <a href="#" onclick="document.getElementById('logoutForm').submit(); return false;">Đăng Xuất</a>
    </div>
</div>

<div class="main-header">
    <div class="logo" id="logo">
        <img src="/images/shop.png" alt="Shop Logo" class="logo-img">
        MyShop
    </div> 
    <input type="text" placeholder="Tìm sản phẩm..." class="search-box">
    <div class="cart-icon" onclick="goToOrderPage()" sec:authorize="hasRole('CUSTOMER')">🛒 <span id="cart-count">0</span></div>
</div>

<!-- Nút mở modal -->
<button id="openModalBtn" sec:authorize="hasRole('ADMIN')">➕ Thêm Sản Phẩm</button>

<!-- Modal thêm sản phẩm -->
<div id="productModal" class="modal hidden">
    <div class="modal-content">
        <span class="close">&times;</span>
        <h2>Thêm Sản Phẩm</h2>
        <input type="text" id="name" placeholder="Tên sản phẩm"><br>
        <input type="text" id="description" placeholder="Mô tả"><br>
        <input type="number" id="price" placeholder="Giá" step="0.01"><br>
        <input type="file" id="imageFile"><br>
        <button onclick="uploadAndCreateProduct()">Tạo sản phẩm</button>
    </div>
</div>

<!-- Danh sách sản phẩm -->
<div id="product-list" class="product-grid"></div>
<!-- Modal chi tiết sản phẩm -->
<div id="detailModal" class="modal hidden">
    <div class="modal-content detail-modal">
        <span class="close-detail">&times;</span>
        <h2 id="detailName"></h2>
        <img id="detailImage" src="" alt="Product Image">
        <p id="detailDescription"></p>
        <div id="detailPrice"></div>
        <button class="add-to-cart-btn" sec:authorize="hasRole('CUSTOMER')">🛒 Thêm vào giỏ</button>
    </div>
</div>

<script src="/js/index.js"></script>

</body>
</html>
